name: Offline workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install matching ScopeLens
        run: python -m pip install "git+https://github.com/Zendeni/scopelens.git@5c5574b83ca75c16f4a8f9211d5e2c6205ab8dc3"
      - name: Check shell syntax
        run: bash -n htb-init.sh
      - name: Test offline integration
        run: python -m unittest discover -s tests -v
